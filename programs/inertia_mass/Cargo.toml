[package]
name = "inertia_mass"
version = "0.1.0"
description = "INERTIA (INRT) — pool constant-product tanpa curve, fee dikembalikan ke massa"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "inertia_mass"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = { version = "1.2.2", features = ["token", "associated_token"] }

[dev-dependencies]
# LiteSVM 0.18 (Agave 4.3) — versi 0.15 tidak lagi kompilasi dengan
# resolusi crate Solana terbaru (konflik solana-account 4 vs 5).
litesvm = "0.18.2"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
# Parser event di test meniru klien (log `Program data:` berbasis base64).
base64 = "0.22"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
